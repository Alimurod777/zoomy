services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: zoomy-cli-proxy-api
    restart: unless-stopped
    volumes:
      - ./cli-proxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./cli-proxy/auths:/root/.cli-proxy-api

  zoomy:
    build: ./bot
    container_name: zoomy
    restart: unless-stopped
    # Time for the bot to stop live recordings and finalize the files on
    # shutdown; keep it above SHUTDOWN_GRACE_SECS (default 75) in bot.py.
    stop_grace_period: 90s
    env_file: .env
    environment:
      RECORDINGS_DIR: /recordings
      ZOOM_STATE_PATH: /secrets/zoom_state.json
      YOUTUBE_TOKEN_PATH: /secrets/youtube_token.json
    depends_on:
      - cli-proxy-api
    volumes:
      - ./recordings:/recordings
      # Saved Zoom login (see bot/zoom_login.py) for hosts that require
      # signed-in participants. Mounted as a directory so a missing
      # zoom_state.json stays missing — Docker would turn a bind mount of an
      # absent *file* into an empty directory of that name. Read-only: the bot
      # only ever loads it.
      - ./secrets:/secrets:ro
    shm_size: "2gb"
